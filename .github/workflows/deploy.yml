name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read   # close_dora_failures.sh lists this workflow's own runs (RC1-464)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Pinned to match ci.yml so builds and deploys are reproducible and the
      # validated template is built by the same toolchain that validated it.
      - uses: aws-actions/setup-sam@v2
        with:
          version: 1.165.0

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: SAM build
        run: sam build

      # DORA needs the deploy's start time; GITHUB_ENV is the only state that
      # survives between steps.
      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: SAM deploy
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      # The 401 comes from the ingest function itself: the Datadog webhook
      # without its secret. That proves the new code imports, reads Secrets
      # Manager and answers. API Gateway alone would say 404 or 5xx.
      - name: Gate on the ingest function answering
        id: ingest_gate
        run: |
          url=$(aws cloudformation describe-stacks --stack-name ai-incident-summarizer \
            --query "Stacks[0].Outputs[?OutputKey=='WebhookApiUrl'].OutputValue" --output text)
          scripts/wait_for_http.sh POST "$url/webhook/datadog" 401

      # A failed gate is a change failure — deployed but not serving (RC1-464).
      # Only the gate: a sam deploy failure ships nothing.
      - name: Report change failure to Datadog DORA
        if: failure() && steps.ingest_gate.outcome == 'failure'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: scripts/report_dora_failure.sh incident-summarizer

      - name: Report deploy to Datadog DORA
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: scripts/report_dora_deployment.sh incident-summarizer "$DEPLOY_STARTED_AT"

      - name: Close restored DORA change failures
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/close_dora_failures.sh incident-summarizer deploy.yml "Gate on the ingest function answering"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test-and-deploy
    permissions:
      contents: read
      actions: read   # close_dora_failures.sh lists this workflow's own runs (RC1-464)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Deploy frontend to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest --prod --token "$VERCEL_TOKEN"

      # /api/incidents assumes DashboardReadRole via Vercel OIDC and reads
      # DynamoDB, so a 200 there is the whole read path, not just a static page.
      - name: Gate on the dashboard serving incidents
        id: dashboard_gate
        run: scripts/wait_for_http.sh GET https://incidents.hihelloreid.com/api/incidents 200

      # Same contract as the backend job, for the dashboard's own service
      # (RC1-464): a failed gate after a green Vercel deploy is a change
      # failure for incidents-hihelloreid.
      - name: Report change failure to Datadog DORA
        if: failure() && steps.dashboard_gate.outcome == 'failure'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: scripts/report_dora_failure.sh incidents-hihelloreid

      - name: Report deploy to Datadog DORA
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: scripts/report_dora_deployment.sh incidents-hihelloreid "$DEPLOY_STARTED_AT"

      - name: Close restored DORA change failures
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/close_dora_failures.sh incidents-hihelloreid deploy.yml "Gate on the dashboard serving incidents"

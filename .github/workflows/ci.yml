name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pinned deliberately. `sam validate --lint` runs cfn-lint bundled inside the
      # SAM CLI, and cfn-lint ships a dataset of Lambda runtime deprecation dates
      # that changes between releases. Left unpinned, this gate can start or stop
      # reporting findings with no change to the template — which is exactly how a
      # developer's local run and CI came to disagree (RC1-223).
      #
      # Bump this version deliberately, and keep local SAM CLI on the same version.
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          version: 1.165.0

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate SAM template
        # sam validate does not call AWS — dummy credentials satisfy the SDK
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: sam validate --lint

  # The frontend had no CI at all until RC1-222: a type error or a lint
  # finding merged cleanly and first surfaced when Vercel built `main`. Every
  # step here is blocking; fix findings in the change that caused them rather
  # than loosening the gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Same major as deploy.yml's Vercel step.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

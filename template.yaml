AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI-powered incident alert summarizer

Parameters:
  GithubWebhookSecretArn:
    Type: String
    Description: Secrets Manager ARN for the GitHub webhook signing secret
  DatadogWebhookSecretArn:
    Type: String
    Description: Secrets Manager ARN for the Datadog X-Webhook-Secret shared header value
  AnthropicApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN for the Anthropic API key
  SlackBotTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN for the Slack bot token
  SlackChannelId:
    Type: String
    Description: Slack channel ID to post incident alerts to
  JiraApiTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN for the Jira API token
  JiraBaseUrl:
    Type: String
    Description: Base URL for the Jira instance (e.g. https://your-org.atlassian.net)
  JiraProjectKey:
    Type: String
    Description: Jira project key for new incident tickets (e.g. INC)
  JiraUserEmail:
    Type: String
    Description: Email address associated with the Jira API token
  DatadogApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN for the Datadog API key
  DatadogEnv:
    Type: String
    Description: Deployment environment for Datadog tagging (dev / staging / prod)
    Default: dev
  IncidentDashboardUrl:
    Type: String
    Description: Base URL of the incident history UI, linked from Datadog events (empty to omit the link)
    Default: https://incidents.hihelloreid.com
  VercelTeamSlug:
    Type: String
    Description: >-
      Vercel team slug (the "owner" in an OIDC subject claim). Together with
      VercelProjectName it pins DashboardReadRole's trust policy to one Vercel
      project; a blanket trust of oidc.vercel.com would let any Vercel account
      assume the role.
  VercelProjectName:
    Type: String
    Default: ai-incident-summarizer
    Description: Vercel project name of the dashboard, as it appears in the OIDC subject claim

Globals:
  Function:
    # python3.14 on Amazon Linux 2023 (RC1-221, re-applied under RC1-385).
    # AL2 reached end of life on 2026-06-30 and python3.11 rode it; 3.14
    # deprecates 2029-06-30, the furthest-out date available. Local .venv,
    # both CI workflows and this runtime are deliberately the same
    # interpreter.
    #
    # MemorySize is the finding from RC1-385, not a tuning choice. The first
    # move to 3.14 (2026-09-04) was reverted because SummarizerFunction did
    # its work in ~16 s and then sat until the deadline with no exception.
    # Two diagnoses were tried and were wrong (the timeout, the Anthropic
    # client). The REPORT lines held the answer all along: every summarizer
    # invocation on record, clean or hung, reported Max Memory Used equal to
    # the 128 MB it was given, and the six other functions of the time peaked at 118-123
    # MB on 3.14. The summarizer actually needs ~220 MB; at 128 it finished
    # its handler by thrashing the page cache and never completed the
    # post-handler flush. On 3.11 it fit by a hair and took 15-23 s; on 3.14
    # with 512 MB it takes ~7 s. Verified live on 2026-09-05 on both the
    # open-incident and recovery paths with tracing on (INC-82). 256 here is
    # a floor (the ingest function inherits it); the summarizer overrides it
    # below. Do not take any function back to 128.
    #
    # The Datadog layer version below is pinned and must move with the
    # runtime line: the Python version is baked into the *layer name*, and
    # the handler is Datadog's wrapper, so a mismatch fails at import on the
    # first invocation of every function behind a green CloudFormation deploy.
    #
    # Finding the latest layer version is not obvious: Datadog's resource
    # policy grants GetLayerVersion but not ListLayerVersions, so `aws lambda
    # list-layer-versions` returns AccessDenied and an unpublished version is
    # indistinguishable from one you cannot read. Probe upward instead:
    #   aws lambda get-layer-version --region us-east-1 \
    #     --layer-name arn:aws:lambda:us-east-1:464622532012:layer:Datadog-Python314 \
    #     --version-number N
    # Datadog-Python314:127 and Datadog-Extension:99 were the latest published
    # on 2026-09-04 and are what ran clean on 2026-09-05.
    Runtime: python3.14
    # 29 s is API Gateway's integration cap and applies to the ingest
    # function, which sits behind it. The summarizer overrides it below.
    Timeout: 29
    MemorySize: 256
    Handler: datadog_lambda.handler.handler
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: incident-summarizer
        DD_LAMBDA_HANDLER: app.handler
        DD_API_KEY_SECRET_ARN: !Ref DatadogApiKeySecretArn
        DD_SITE: datadoghq.com
        DD_ENV: !Ref DatadogEnv
        DD_TRACE_ENABLED: "true"
        DD_SERVERLESS_LOGS_ENABLED: "true"
        DD_CAPTURE_LAMBDA_PAYLOAD: "false"
        DD_FLUSH_TO_LOG: "false"
        # LLM Observability (RC1-419). Set here so both functions carry the
        # flags, but only the summarizer makes a model call, so only it emits
        # LLM Obs spans. No agentless flag: the Datadog Extension on each
        # function forwards them. ddtrace's anthropic integration already
        # produced the APM span the fleet SLO reads; this adds the LLM Obs span
        # beside it, with tokens and cost, so the summarizer appears in the
        # fleet cost widgets like every other model caller in the estate.
        DD_LLMOBS_ENABLED: "1"
        DD_LLMOBS_ML_APP: incident-summarizer
        # One service name for the stack, equal to the ml_app, so production
        # spans read service:incident-summarizer and a future eval run differs
        # only by service (RC1-411). Until 2026-09-10 nothing set DD_SERVICE
        # and Datadog fell back to the raw function name
        # (ai-incident-summarizer-summarizerfunction-...), which is where the
        # APM history before this date sits. POWERTOOLS_SERVICE_NAME never
        # reached Datadog.
        DD_SERVICE: incident-summarizer

Resources:

  # ── Shared layer ────────────────────────────────────────────────────────────

  # No BuildMethod on purpose. ContentUri already carries the python/common/
  # layout Lambda expects; a BuildMethod makes `sam build` copy that tree into
  # a second python/ directory, and the layer ships as python/python/common —
  # which is how every normalizer invocation died on `import common` from
  # layer version 2 (2026-05-18) until RC1-371. Without one, SAM zips the
  # directory as-is. The layer has no dependencies to install.

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.14

  # ── Ingest: webhooks (Datadog + GitHub Actions) and CloudWatch via EventBridge ──
  #
  # One function for everything alert-shaped (RC1-431). It used to be three
  # (webhook receiver → normalizer → dedup) joined by async invokes; they
  # shared no failure domain worth isolating, and the whole path is a few
  # DynamoDB writes, well inside API Gateway's 29 s cap. The EventBridge rule
  # and the two HTTP routes all target this function.

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: Receives inbound webhooks from Datadog and GitHub Actions and hands them to the ingest function

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ingest/
      Description: Authenticates webhooks, normalizes every alert source, deduplicates and groups alerts into incidents, and hands each touched incident to the summarizer
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python314:127
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:99
      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET_ARN: !Ref GithubWebhookSecretArn
          DATADOG_WEBHOOK_SECRET_ARN: !Ref DatadogWebhookSecretArn
          ALERT_STATE_TABLE_NAME: !Ref AlertStateTable
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          SERVICE_REGISTRY_TABLE_NAME: !Ref ServiceRegistryTable
          SUMMARIZER_FUNCTION_NAME: !Ref SummarizerFunction
          CORRELATION_WINDOW_MINUTES: "5"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ServiceRegistryTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref GithubWebhookSecretArn
                - !Ref DatadogWebhookSecretArn
                - !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt SummarizerFunction.Arn
      Events:
        GithubWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook/github
            Method: POST
        DatadogWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook/datadog
            Method: POST

  # ── Alert state: fingerprints + correlation windows ─────────────────────────
  # One TTL-gated table for both kinds of transient row (RC1-432): `fp#<sha256>`
  # rows suppress a repeat of the same alert, `window#<service>` rows group a
  # service's alerts into one incident for 5 minutes. They were two tables with
  # the same shape (conditional put gated on the row's own ttl, delete on
  # recovery); the second table bought nothing but a second name, env var and
  # policy. Rows live 5 minutes, so nothing was migrated at the cutover.

  AlertStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Incident store ───────────────────────────────────────────────────────────

  IncidentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: affected_service
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: service-created-index
          KeySchema:
            - AttributeName: affected_service
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-created-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Service registry ─────────────────────────────────────────────────────────
  # Materialised list of every service that has ever opened an incident. Exists so
  # the dashboard can render service filters with a read that costs O(services)
  # instead of scanning the incident table, which costs O(total table bytes) —
  # ProjectionExpression trims the response, not the consumed capacity.
  #
  # Deliberately has no TimeToLiveSpecification. The incident table's TTL is what
  # silently emptied the dashboard once already; this table must not inherit that.

  ServiceRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: affected_service
          AttributeType: S
      KeySchema:
        - AttributeName: affected_service
          KeyType: HASH

  # ── Summarize + deliver ─────────────────────────────────────────────────────
  #
  # The model call and the whole delivery chain, in one function (RC1-431):
  # Claude, then Slack, then Jira, then the Datadog event timeline, in that
  # order so the event carries both links. Slack, Jira and Datadog used to be
  # three more functions joined by async invokes; the ordering is a sequencing
  # constraint, not a reason for three functions, and each stage was already
  # idempotent about its own artifact. Each stage now also records the
  # generation it delivered, so a retried invocation resumes where it stopped
  # instead of posting the earlier stages again.

  SummarizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/summarizer/
      Description: Summarizes an incident with Claude and delivers it to Slack, Jira and the Datadog event timeline
      # Overrides the 29 s in Globals (RC1-384). That number is API Gateway's
      # integration cap and belongs to the ingest function; this one is
      # invoked asynchronously and sits behind no API Gateway. The model call
      # is ~7 s; the delivery chain adds Slack (three attempts with backoff),
      # up to three Jira calls and one Datadog call, each with a 10 s HTTP
      # timeout. 90 leaves room for one slow stage without turning it into a
      # Lambda timeout and a retry.
      Timeout: 90
      # 512, not the 256 floor in Globals (RC1-385). Measured need is ~220 MB
      # (Max Memory Used, 2026-09-05, both paths). 256 would leave ~36 MB of
      # headroom on a function whose whole failure history is a memory
      # ceiling, and more memory is also more CPU: the run went from 15-23 s
      # at 128 MB to ~7 s at 512, so the GB-seconds bill barely moved.
      MemorySize: 512
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python314:127
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:99
      Environment:
        Variables:
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
          MODEL_ID: claude-sonnet-4-6
          SLACK_BOT_TOKEN_SECRET_ARN: !Ref SlackBotTokenSecretArn
          SLACK_CHANNEL_ID: !Ref SlackChannelId
          JIRA_API_TOKEN_SECRET_ARN: !Ref JiraApiTokenSecretArn
          JIRA_BASE_URL: !Ref JiraBaseUrl
          JIRA_PROJECT_KEY: !Ref JiraProjectKey
          JIRA_USER_EMAIL: !Ref JiraUserEmail
          INCIDENT_DASHBOARD_URL: !Ref IncidentDashboardUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref AnthropicApiKeySecretArn
                - !Ref SlackBotTokenSecretArn
                - !Ref JiraApiTokenSecretArn
                # The Datadog events writer reuses the extension's API key
                # secret: Datadog API keys carry no scopes.
                - !Ref DatadogApiKeySecretArn

  # ── CloudWatch → EventBridge path ──────────────────────────────────────────

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days

  IngestDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IngestDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CloudWatchAlarmEventRule.Arn

  CloudWatchAlarmEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Routes CloudWatch alarm state changes to the ingest Lambda
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
      State: ENABLED
      Targets:
        - Id: IngestTarget
          Arn: !GetAtt IngestFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt IngestDLQ.Arn

  IngestEventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt IngestFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CloudWatchAlarmEventRule.Arn

  # ── Self-test alarm ──
  # Not a production alert source. CloudWatchAlarmEventRule above has no
  # alarm-name filter, so every alarm in the account already feeds the
  # pipeline (today: the three stale-ticket-bot alarms). This one exists only
  # to verify the rule by hand: `aws cloudwatch set-alarm-state --alarm-name
  # ai-incident-summarizer-test-alarm --state-value ALARM --state-reason test`,
  # then OK to recover. It watches the ingest function's own Errors metric, so
  # a real ingest failure would be reported through the failing function; do
  # not rely on it for that (RC1-435).

  TestCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-test-alarm"
      AlarmDescription: Self-test alarm for verifying the EventBridge rule by hand (RC1-33, RC1-435). Not a production alert source.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ── This stack's own production alarms (RC1-435) ──
  # The summarizer function is downstream of ingest, so its failures can be
  # reported through the normal path: alarm -> EventBridge -> ingest -> incident
  # row. The delivery of that incident runs on the summarizer itself, so if it
  # is broken the incident still lands in the table and the dashboard, but not
  # in Slack/Jira/Datadog. The DLQ alarm covers the one hop EventBridge can
  # fail: an ingest invocation that could not be delivered. The names carry
  # the severity keyword the normalizer reads ("high").

  SummarizerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-summarizer-errors-high"
      AlarmDescription: Summarizer function raised an unhandled error (all three Lambda attempts count), so an incident may be unsummarized or undelivered (RC1-435)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SummarizerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  IngestDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ingest-dlq-depth-high"
      AlarmDescription: EventBridge could not deliver a CloudWatch alarm event to the ingest function; the event is in IngestDLQ (RC1-435)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  # ── Dashboard read access via Vercel OIDC federation (RC1-220, folds in RC1-219) ──
  # The Next.js API routes on Vercel read DynamoDB directly. Until RC1-220 they
  # did so as the hand-made IAM user incident-dashboard-readonly with static
  # access keys in Vercel's environment and an inline policy nobody could see
  # from this repo (RC1-218 broke on exactly that). Now Vercel's per-invocation
  # OIDC token is exchanged with STS for credentials on this role, so no
  # long-lived key exists anywhere, and the grant lives next to the tables it
  # covers. The role is also assumable from a developer's machine through
  # `vercel env pull`, which mints a development-environment token; preview
  # deployments are deliberately excluded so a branch cannot read production
  # data. Condition keys are per issuer, so the trust policy is a JSON string.

  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub https://oidc.vercel.com/${VercelTeamSlug}
      ClientIdList:
        - !Sub https://vercel.com/${VercelTeamSlug}
      # SHA-1 of the CA that signs oidc.vercel.com (Let's Encrypt root, captured
      # 2026-09-13). AWS validates Let's Encrypt-issued IdPs against its own
      # trusted-CA list since 2024, so this value is required but not load-bearing.
      ThumbprintList:
        - AB9D0263244DD0326EB67015705A667E79CFE998

  DashboardReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-dashboard-read
      Description: Read-only DynamoDB access for the incident dashboard on Vercel, assumed with the deployment's OIDC token
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Federated": "${VercelOidcProvider}" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "oidc.vercel.com/${VercelTeamSlug}:aud": "https://vercel.com/${VercelTeamSlug}",
                  "oidc.vercel.com/${VercelTeamSlug}:sub": [
                    "owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:production",
                    "owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:development"
                  ]
                }
              }
            }
          ]
        }
      Policies:
        - PolicyName: DynamoDBReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # /api/incidents queries the GSIs, /api/incidents/[id] gets one
              # item. No Scan on the incident table: the incidents route was
              # moved to Query in RC1-218 precisely to avoid scan cost.
              - Sid: ReadIncidents
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt IncidentTable.Arn
                  - !Sub ${IncidentTable.Arn}/index/*
              # /api/services scans the registry; it is small by design.
              - Sid: ReadServiceRegistry
                Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt ServiceRegistryTable.Arn

Outputs:
  WebhookApiUrl:
    # The HTTP API's only stage is `prod`, and a named stage is part of the
    # invoke URL. Without it every call 404s at API Gateway before the receiver
    # runs — which is where both the Datadog and GitHub webhooks pointed until
    # RC1-370.
    Description: Base URL for the webhook API endpoint (includes the stage)
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${WebhookApiprodStage}"

  IngestDLQUrl:
    Description: SQS DLQ URL for failed EventBridge-to-ingest deliveries
    Value: !Ref IngestDLQ

  IncidentTableName:
    Description: DynamoDB incident table name
    Value: !Ref IncidentTable

  ServiceRegistryTableName:
    Description: DynamoDB service registry table name
    Value: !Ref ServiceRegistryTable
  DashboardReadRoleArn:
    Description: Set as AWS_ROLE_ARN in the Vercel project (production + development)
    Value: !GetAtt DashboardReadRole.Arn

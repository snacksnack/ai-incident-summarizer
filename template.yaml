AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI-powered incident alert summarizer

Parameters:
  GithubWebhookSecretArn:
    Type: String
    Description: Secrets Manager ARN for the GitHub webhook signing secret
  DatadogWebhookSecretArn:
    Type: String
    Description: Secrets Manager ARN for the Datadog X-Webhook-Secret shared header value
  AnthropicApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN for the Anthropic API key
  SlackBotTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN for the Slack bot token
  SlackChannelId:
    Type: String
    Description: Slack channel ID to post incident alerts to
  JiraApiTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN for the Jira API token
  JiraBaseUrl:
    Type: String
    Description: Base URL for the Jira instance (e.g. https://your-org.atlassian.net)
  JiraProjectKey:
    Type: String
    Description: Jira project key for new incident tickets (e.g. INC)
  JiraUserEmail:
    Type: String
    Description: Email address associated with the Jira API token
  DatadogApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN for the Datadog API key
  DatadogEnv:
    Type: String
    Description: Deployment environment for Datadog tagging (dev / staging / prod)
    Default: dev
  IncidentDashboardUrl:
    Type: String
    Description: Base URL of the incident history UI, linked from Datadog events (empty to omit the link)
    Default: https://incidents.hihelloreid.com

Globals:
  Function:
    # python3.11 — reverted from python3.14 on 2026-09-05 (RC1-385).
    #
    # RC1-221 moved all seven functions to 3.14 and the chain passed, but
    # SummarizerFunction stopped completing: it did its work in ~16 s and then
    # sat until whatever deadline it was given (29 s, then 120 s, then 60 s),
    # ending in `Exiting: timeout` with no exception and nothing in the log to
    # explain it. Every incident logged a Lambda error while appearing to
    # succeed. Two fixes were tried and neither touched it — the timeout was
    # never the constraint, and reusing the Anthropic client across
    # invocations changed nothing. Rather than keep guessing on production,
    # this is back on the runtime that ran clean for six consecutive
    # invocations. RC1-385 holds the open investigation.
    #
    # Do not re-attempt the upgrade without first answering "extension or
    # SDK": deploy the summarizer alone with DD_TRACE_ENABLED=false on 3.14
    # and see whether the hang survives. python3.12 (AL2023, deprecates
    # 2028-10-31) is the smaller next step if it turns out to be specific to
    # 3.14 rather than to AL2023.
    #
    # The clock this is running against: python3.11 sits on Amazon Linux 2,
    # which reached end of life 2026-06-30. AWS patches it for critical AL2
    # issues until deprecation on 2027-06-30; creates block 2027-07-31 and
    # updates 2027-08-31. Roughly 22 months of runway — comfortable, not
    # indefinite.
    #
    # The Datadog layer version below is pinned and must move with this line:
    # the Python version is baked into the *layer name*, and the handler is
    # Datadog's wrapper, so a mismatch fails at import on the first invocation
    # of every function behind a green CloudFormation deploy.
    #
    # Finding the latest layer version is not obvious: Datadog's resource
    # policy grants GetLayerVersion but not ListLayerVersions, so `aws lambda
    # list-layer-versions` returns AccessDenied and an unpublished version is
    # indistinguishable from one you cannot read. Probe upward instead:
    #   aws lambda get-layer-version --region us-east-1 \
    #     --layer-name arn:aws:lambda:us-east-1:464622532012:layer:Datadog-Python311 \
    #     --version-number N
    # Datadog-Python311:125 / Datadog-Extension:97 are what ran clean here.
    # For reference when the upgrade is retried: Datadog-Python312/313/314 all
    # existed at :127, and Datadog-Extension at :99, as of 2026-09-04.
    Runtime: python3.11
    Timeout: 29
    MemorySize: 128
    Handler: datadog_lambda.handler.handler
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: incident-summarizer
        DD_LAMBDA_HANDLER: app.handler
        DD_API_KEY_SECRET_ARN: !Ref DatadogApiKeySecretArn
        DD_SITE: datadoghq.com
        DD_ENV: !Ref DatadogEnv
        DD_TRACE_ENABLED: "true"
        DD_SERVERLESS_LOGS_ENABLED: "true"
        DD_CAPTURE_LAMBDA_PAYLOAD: "false"
        DD_FLUSH_TO_LOG: "false"

Resources:

  # ── Shared layer ────────────────────────────────────────────────────────────

  # No BuildMethod on purpose. ContentUri already carries the python/common/
  # layout Lambda expects; a BuildMethod makes `sam build` copy that tree into
  # a second python/ directory, and the layer ships as python/python/common —
  # which is how every normalizer invocation died on `import common` from
  # layer version 2 (2026-05-18) until RC1-371. Without one, SAM zips the
  # directory as-is. The layer has no dependencies to install.

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.11

  # ── Webhook path (Datadog + GitHub Actions) ─────────────────────────────────

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: Receives inbound webhooks from Datadog and GitHub Actions

  WebhookReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/webhook_receiver/
      Description: Validates HMAC signatures and forwards payloads to the normalizer
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET_ARN: !Ref GithubWebhookSecretArn
          DATADOG_WEBHOOK_SECRET_ARN: !Ref DatadogWebhookSecretArn
          NORMALIZER_FUNCTION_NAME: !Ref NormalizerFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref GithubWebhookSecretArn
                - !Ref DatadogWebhookSecretArn
                - !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt NormalizerFunction.Arn
      Events:
        GithubWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook/github
            Method: POST
        DatadogWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook/datadog
            Method: POST

  # ── Normalizer ──────────────────────────────────────────────────────────────

  NormalizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/normalizer/
      Description: Normalises raw alert payloads to the shared incident schema
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          DEDUP_FUNCTION_NAME: !Ref DedupFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt DedupFunction.Arn

  # ── Deduplication + correlation ─────────────────────────────────────────────

  DeduplicationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fingerprint
          AttributeType: S
      KeySchema:
        - AttributeName: fingerprint
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  CorrelationWindowTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: service_key
          AttributeType: S
      KeySchema:
        - AttributeName: service_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DedupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/dedup/
      Description: Suppresses duplicate alerts and groups related alerts into incidents
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          DEDUP_TABLE_NAME: !Ref DeduplicationTable
          CORRELATION_TABLE_NAME: !Ref CorrelationWindowTable
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          SERVICE_REGISTRY_TABLE_NAME: !Ref ServiceRegistryTable
          SUMMARIZER_FUNCTION_NAME: !Ref SummarizerFunction
          CORRELATION_WINDOW_MINUTES: "5"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeduplicationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CorrelationWindowTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ServiceRegistryTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt SummarizerFunction.Arn

  # ── Incident store ───────────────────────────────────────────────────────────

  IncidentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: affected_service
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: service-created-index
          KeySchema:
            - AttributeName: affected_service
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-created-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Service registry ─────────────────────────────────────────────────────────
  # Materialised list of every service that has ever opened an incident. Exists so
  # the dashboard can render service filters with a read that costs O(services)
  # instead of scanning the incident table, which costs O(total table bytes) —
  # ProjectionExpression trims the response, not the consumed capacity.
  #
  # Deliberately has no TimeToLiveSpecification. The incident table's TTL is what
  # silently emptied the dashboard once already; this table must not inherit that.

  ServiceRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: affected_service
          AttributeType: S
      KeySchema:
        - AttributeName: affected_service
          KeyType: HASH

  # ── LLM summarizer ──────────────────────────────────────────────────────────

  SummarizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/summarizer/
      Description: Summarizes grouped incidents using Claude via the Anthropic API
      # Overrides the 29 s in Globals (RC1-384). That number exists for the
      # webhook receiver alone — API Gateway caps its integration at 29 s — and
      # every other function inherited it by accident. This one is invoked
      # asynchronously, sits behind no API Gateway, and makes a model call, so
      # the cap never applied to it. Real work is 15-23 s.
      #
      # 60, not the 120 this briefly carried: the timeout was never the bug
      # (RC1-385). Kept after the revert to python3.11 on its own merit — the
      # inherited 29 s left almost no margin, and a run at 23.5 s on 09-04 was
      # one slow model call from the wall.
      Timeout: 60
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
          MODEL_ID: claude-sonnet-4-6
          SLACK_NOTIFIER_FUNCTION_NAME: !Ref SlackNotifierFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref AnthropicApiKeySecretArn
                - !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt SlackNotifierFunction.Arn

  # ── Slack notifier ───────────────────────────────────────────────────────────

  SlackNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/slack_notifier/
      Description: Posts incident summaries to Slack and maintains thread continuity
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          SLACK_BOT_TOKEN_SECRET_ARN: !Ref SlackBotTokenSecretArn
          SLACK_CHANNEL_ID: !Ref SlackChannelId
          JIRA_CREATOR_FUNCTION_NAME: !Ref JiraCreatorFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref SlackBotTokenSecretArn
                - !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt JiraCreatorFunction.Arn

  # ── Jira ticket creator ──────────────────────────────────────────────────────

  JiraCreatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jira_creator/
      Description: Creates Jira tickets for new incidents and writes the ticket ID back to DynamoDB
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          JIRA_API_TOKEN_SECRET_ARN: !Ref JiraApiTokenSecretArn
          JIRA_BASE_URL: !Ref JiraBaseUrl
          JIRA_PROJECT_KEY: !Ref JiraProjectKey
          JIRA_USER_EMAIL: !Ref JiraUserEmail
          SLACK_CHANNEL_ID: !Ref SlackChannelId
          DATADOG_EVENTS_FUNCTION_NAME: !Ref DatadogEventsFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JiraApiTokenSecretArn
                - !Ref DatadogApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt DatadogEventsFunction.Arn

  # ── Datadog events writer ────────────────────────────────────────────────────
  # Closes the loop: the summary that came out of Datadog's alerts goes back in
  # as an event, so the timeline shows the LLM summary beside the raw monitors.
  # Reuses the extension's API key secret — Datadog API keys carry no scopes.

  DatadogEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/datadog_events/
      Description: Posts incident summaries to the Datadog Events API and writes the event ID back to DynamoDB
      Layers:
        - !Ref CommonLayer
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Python311:125
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:97
      Environment:
        Variables:
          INCIDENT_TABLE_NAME: !Ref IncidentTable
          SLACK_CHANNEL_ID: !Ref SlackChannelId
          JIRA_BASE_URL: !Ref JiraBaseUrl
          INCIDENT_DASHBOARD_URL: !Ref IncidentDashboardUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatadogApiKeySecretArn

  # ── CloudWatch → EventBridge path ──────────────────────────────────────────

  NormalizerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days

  NormalizerDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NormalizerDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NormalizerDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CloudWatchAlarmEventRule.Arn

  CloudWatchAlarmEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Routes CloudWatch alarm state changes to the normalizer Lambda
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
      State: ENABLED
      Targets:
        - Id: NormalizerTarget
          Arn: !GetAtt NormalizerFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt NormalizerDLQ.Arn

  NormalizerEventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt NormalizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CloudWatchAlarmEventRule.Arn

  # ── Test alarm (trigger manually with set-alarm-state to verify the rule) ──

  TestCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-test-alarm"
      AlarmDescription: Test alarm for EventBridge rule verification (RC1-33)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NormalizerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  WebhookApiUrl:
    # The HTTP API's only stage is `prod`, and a named stage is part of the
    # invoke URL. Without it every call 404s at API Gateway before the receiver
    # runs — which is where both the Datadog and GitHub webhooks pointed until
    # RC1-370.
    Description: Base URL for the webhook API endpoint (includes the stage)
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${WebhookApiprodStage}"

  NormalizerDLQUrl:
    Description: SQS DLQ URL for failed EventBridge-to-normalizer deliveries
    Value: !Ref NormalizerDLQ

  IncidentTableName:
    Description: DynamoDB incident table name
    Value: !Ref IncidentTable

  ServiceRegistryTableName:
    Description: DynamoDB service registry table name
    Value: !Ref ServiceRegistryTable
